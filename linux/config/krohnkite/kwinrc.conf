# OS Zimmee -- Krohnkite settings.
#
# Format: <key>=<value>, applied to the [Script-krohnkite] group of kwinrc via
# kwriteconfig6. kwinrc is shared with the rest of KWin, so it cannot simply be
# symlinked from this repo -- these keys are written into the live file instead.
#
# Deliberately minimal. Krohnkite's own defaults are reasonable; only the things
# worth pinning across machines are set here.

# Gaps, in pixels.
screenGapTop=8
screenGapBottom=8
screenGapLeft=8
screenGapRight=8
tileLayoutGap=8

# A single tiled window fills its area rather than sitting in a gap-framed box.
maximizeSoleTile=true
