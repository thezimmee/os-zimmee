# OS Zimmee -- Krohnkite settings.
#
# Format: <key>=<value>, applied to the [Script-krohnkite] group of kwinrc via
# kwriteconfig6. kwinrc is shared with the rest of KWin, so it cannot simply be
# symlinked from this repo -- these keys are written into the live file instead.
#
# Key names were read out of the installed package's own schema
# (~/.local/share/kwin/scripts/krohnkite/contents/config/main.xml) rather than
# from upstream docs. Two keys this file used to set do not exist in this fork
# and were being silently ignored: `tileLayoutGap` (the real key is
# `screenGapBetween`) and `maximizeSoleTile` (the real keys are the
# `soleWindow*` group below). A wrong key here fails without any warning.

# --- gaps -------------------------------------------------------------------
# OUTER spacing, i.e. between the tiled area and the screen edge. Zero means
# tiles run flush to the edges.
screenGapLeft=0
screenGapRight=0
screenGapTop=0
screenGapBottom=0

# INNER spacing, between adjacent tiles. Set to 0 for a completely seamless grid.
screenGapBetween=1

# A lone window fills its screen completely -- no gap, no border.
soleWindowNoGaps=true
soleWindowNoBorders=true
soleWindowWidth=100
soleWindowHeight=100

# Gaps are global, not per-layout. Krohnkite's only override mechanism is
# per-OUTPUT / activity / virtual desktop, via gapsOverrideConfig, e.g.
#   DP-2:r=10,l=20,between=10
#   HDMI-A-1:<activity-uuid>:Desktop 1:e=0
# one rule per line, short names l,r,t,b,e. Left unset here.

# --- which layouts are in the cycle -----------------------------------------
# Each layout has an ORDER, not an on/off switch. The number is its position in
# the Hyper+' cycle; **0 removes it from the cycle entirely**. Keep the cycle
# short -- every extra layout is another press to get past.
tileLayoutOrder=1
monocleLayoutOrder=2
floatingLayoutOrder=3
columnsLayoutOrder=4

# Available but out of the cycle. Give any of these a number to add it back.
threeColumnLayoutOrder=0
spiralLayoutOrder=0
quarterLayoutOrder=0
stackedLayoutOrder=0
spreadLayoutOrder=0
stairLayoutOrder=0
binaryTreeLayoutOrder=0
cascadeLayoutOrder=0

# columns has a second, separate switch on top of its order.
enableColumnsLayout=true

# --- default layout ----------------------------------------------------------
# What layout a screen/desktop/activity starts in before Krohnkite has any
# remembered state for it. Comma-separated entries of
# <output>:[<activity>:][<desktop>:]<layout> -- an empty <output> matches every
# screen. <layout> can be a name (matched case-insensitively, "layout" suffix
# optional) or a numeric cycle position from the block above; name is safer
# since it survives reordering. Source: KWINCONFIG.screenDefaultLayout /
# LayoutStoreEntry constructor in
# ~/.local/share/kwin/scripts/krohnkite/contents/code/script.js -- this key
# isn't documented in main.xml beyond its label.
screenDefaultLayout=:floating

# --- behaviour --------------------------------------------------------------
# Monocle already maximizes; leave the rest of the stack un-minimized so
# Hyper+H/J/K/L can still move through it.
monocleMaximize=true
monocleMinimizeRest=false
