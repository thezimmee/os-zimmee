# OS Zimmee -- keyd
# Deployed to /etc/keyd/default.conf (symlinked from this repo).
#
# CapsLock becomes a dual-role Hyper key, matching the Karabiner (macOS) and
# AutoHotkey (Windows) configs in this repo:
#   held  -> Hyper prefix, emitted as Super+Ctrl
#   tapped alone -> Super+Space, which opens the launcher
#
# CapsLock's original toggle function is gone entirely. That is intentional.
#
# ESCAPE HATCH: if a bad config ever leaves the keyboard unusable, press
# backspace + escape + enter together to terminate keyd and restore raw input.

[ids]
# All keyboards, including the laptop's internal one.
*

[main]
capslock = overload(hyper, M-space)

# The Hyper layer holds Super+Ctrl for as long as CapsLock is held, so
# Hyper+<key> reaches the focused app as Super+Ctrl+<key>.
#
# KDE claims a number of Super+Ctrl combinations by default; the ones that
# collide are unbound by linux/config/kde/shortcuts.conf.
[hyper:M-C]
