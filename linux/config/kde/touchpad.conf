# OS Zimmee -- KDE touchpad settings.
#
# Format: <key>=<value>, applied to each touchpad's per-device group in
# kcminputrc. The module discovers the device rather than hardcoding it, since
# the group name embeds this machine's vendor/product IDs.
#
# DisableEventsOnExternalMouse MUST be false on any machine running keyd.
# keyd unconditionally creates a "keyd virtual pointer" input device, KDE
# classifies that as an external mouse, and the touchpad is then disabled for
# the whole session. Symptom: touchpad dead after login, alive the moment keyd
# is stopped. keyd's own logs are misleading here -- it reports "ignoring" the
# touchpad, and that is true; the damage is done by the virtual device it adds,
# not by anything it grabs.
DisableEventsOnExternalMouse=false
