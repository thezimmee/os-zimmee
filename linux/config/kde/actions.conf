# OS Zimmee -- action id -> KDE implementation.
#
# The cross-OS contract lives in shared/shortcuts/keymap.conf, which maps a
# CHORD to an ACTION ID. This file is the Linux half: it maps that action id to
# the KDE/KWin action that implements it. Nothing here is a chord.
#
# Porting to another desktop means writing a sibling of this file, not touching
# keymap.conf. See shared/shortcuts/README.md S7 ("KDE is a backend").
#
# FORMAT:  <action> | <component> | <key>
#
#   <component>  the kglobalshortcutsrc group. Nested groups use '/', e.g.
#                services/org.kde.spectacle.desktop
#   <key>        the action name inside that component
#
# Actions NOT listed here:
#   sys.launcher   the CapsLock tap; keyd emits Meta+Space, KRunner owns it.
#                  Bound in shortcuts.conf, not through the action table.
#   app.*          provided by the generated osz-apps KWin script; the module
#                  derives their action names from config/kde/apps.conf.

# --- windows: focus (Krohnkite) ----------------------------------------------
wm.focus.left           | kwin | KrohnkiteFocusLeft
wm.focus.down           | kwin | KrohnkiteFocusDown
wm.focus.up             | kwin | KrohnkiteFocusUp
wm.focus.right          | kwin | KrohnkiteFocusRight

# --- windows: move (generated osz-snapcycle KWin script) --------------------
# NOT Krohnkite's own ShiftLeft/Right/Up/Down directly -- those nudge a
# FLOATING window by a fixed step with no clamping to the screen, so repeated
# presses walk it straight off the edge. OszMoveStep* does the same 5% step
# but clamps to the usable area, so it stops exactly at the edge instead. On a
# TILED window it still ends up doing exactly what KrohnkiteShift* always did
# (tile-order move) -- see the comment above moveStep() in the generated
# script for how it tells the two cases apart without being able to ask
# Krohnkite directly.
wm.move.left            | kwin | OszMoveStepLeft
wm.move.down            | kwin | OszMoveStepDown
wm.move.up              | kwin | OszMoveStepUp
wm.move.right           | kwin | OszMoveStepRight

# --- windows: resize (Krohnkite) --------------------------------------------
# NOTE the lowercase 'g' in KrohnkitegrowWidth. That is upstream's spelling, not
# a typo here -- the other three are capitalised. Getting it wrong fails silently.
wm.resize.shrinkwidth   | kwin | KrohnkiteShrinkWidth
wm.resize.growheight    | kwin | KrohnkiteGrowHeight
wm.resize.shrinkheight  | kwin | KrohnkiteShrinkHeight
wm.resize.growwidth     | kwin | KrohnkitegrowWidth

# --- circular focus ---------------------------------------------------------
# Cycles the whole window list and WRAPS -- verified: warp -> claude -> brave ->
# code -> warp. Unlike the directional keys this ignores geometry entirely, so
# it is the one focus command that behaves the same in every layout, including
# floating (where left/right is ambiguous and directional focus degrades to
# list order anyway).
wm.focus.next           | kwin | KrohnkiteFocusNext
wm.focus.prev           | kwin | KrohnkiteFocusPrev

# --- layout (Krohnkite) -----------------------------------------------------
wm.layout.next          | kwin | KrohnkiteNextLayout
wm.layout.prev          | kwin | KrohnkitePreviousLayout
# NOT native "Window Maximize" -- REVERTED after real-world testing found it
# breaks Krohnkite navigation. Krohnkite's own state getter special-cases the
# native maximizedAboutToChange signal to force WindowState.NativeMaximized,
# which isTileableState() excludes outright -- so the instant Hyper+M native-
# maximizes a window, KrohnkiteFocusLeft/Right/Up/Down and KrohnkiteShift* stop
# seeing it entirely (confirmed live: focus cycling skipped it, move did
# nothing). KrohnkiteMonocleLayout avoids this: with monocleMaximize=true
# (config/krohnkite/kwinrc.conf) a monocled window becomes WindowState.Maximized
# instead, which IS tileable -- focus/move keep working, and it's a genuine
# toggle (KrohnkiteLayout.setLayout: requesting Monocle while already in
# Monocle switches back to whatever layout was active before). This also
# matches the description keymap.conf already carried ("Maximize (monocle)")
# before this row was wired to something else.
wm.maximize             | kwin | KrohnkiteMonocleLayout
# The literal edge-to-edge escape hatch (Hyper+Shift+O) -- for when Krohnkite
# gaps/borders/monocle-layout bookkeeping genuinely aren't wanted. NOT native
# "Window Maximize" either, for the exact same reason wm.maximize isn't: that
# breaks focus/move for as long as it's active. OszMaximizeToggle (generated
# osz-snapcycle KWin script) sets frameGeometry directly instead, which never
# touches maximizeMode, so Krohnkite never excludes the window -- nav keeps
# working. Meant for a floating window; on a Krohnkite-managed one it falls
# back to the same monocle maximize wm.maximize uses.
wm.maximize.native      | kwin | OszMaximizeToggle
wm.float                | kwin | KrohnkiteToggleFloat
wm.master               | kwin | KrohnkiteSetMaster

# --- windows: snap-cycle (generated osz-snapcycle KWin script) -------------
# Sizes come from config/kde/snapcycle.conf, not from here -- this row only
# says which KWin action id the shortcut fires.
wm.snap.left            | kwin | OszSnapLeft
wm.snap.right           | kwin | OszSnapRight
wm.snap.top             | kwin | OszSnapTop
wm.snap.bottom          | kwin | OszSnapBottom

# --- windows: KWin built-ins ------------------------------------------------
# Centres the focused window on its screen. Only meaningful for a FLOATING
# window -- a tiled one is re-tiled by Krohnkite the instant it moves.
wm.center               | kwin | Window Move Center
wm.fullscreen           | kwin | Window Fullscreen
sys.close               | kwin | Window Close

# --- quit application -------------------------------------------------------
# KDE has no "quit application" action -- Window Close closes one window. This
# is provided by the generated osz-apps KWin script, which closes every window
# sharing the active window's resource class. Registered under the kwin
# component, like every KWin script action.
sys.quit                | kwin | OszQuitApp

# --- displays (circular) ----------------------------------------------------
mon.focus.prev          | kwin | Switch to Previous Screen
mon.focus.next          | kwin | Switch to Next Screen
mon.movewin.prev        | kwin | Window to Previous Screen
mon.movewin.next        | kwin | Window to Next Screen

# --- workspaces (circular; these wrap, the grid-directional defaults do not) -
ws.prev                 | kwin | Switch to Previous Desktop
ws.next                 | kwin | Switch to Next Desktop
ws.movewin.prev         | kwin | Window to Previous Desktop
ws.movewin.next         | kwin | Window to Next Desktop

# --- workspaces (absolute) --------------------------------------------------
ws.go.1                 | kwin | Switch to Desktop 1
ws.go.2                 | kwin | Switch to Desktop 2
ws.go.3                 | kwin | Switch to Desktop 3
ws.go.4                 | kwin | Switch to Desktop 4
ws.go.5                 | kwin | Switch to Desktop 5
ws.go.6                 | kwin | Switch to Desktop 6
ws.go.7                 | kwin | Switch to Desktop 7
ws.go.8                 | kwin | Switch to Desktop 8
ws.go.9                 | kwin | Switch to Desktop 9
ws.movewin.1            | kwin | Window to Desktop 1
ws.movewin.2            | kwin | Window to Desktop 2
ws.movewin.3            | kwin | Window to Desktop 3
ws.movewin.4            | kwin | Window to Desktop 4
ws.movewin.5            | kwin | Window to Desktop 5
ws.movewin.6            | kwin | Window to Desktop 6
ws.movewin.7            | kwin | Window to Desktop 7
ws.movewin.8            | kwin | Window to Desktop 8
ws.movewin.9            | kwin | Window to Desktop 9

# --- system -----------------------------------------------------------------
sys.screenshot          | services/org.kde.spectacle.desktop     | RectangularRegionScreenShot
sys.record              | services/org.kde.spectacle.desktop     | RecordRegion
sys.emoji               | services/org.kde.plasma.emojier.desktop | _launch
