# OS Zimmee -- window snap-cycle sizes.
#
# Pressing a wm.snap.<direction> shortcut snaps the active window to that edge
# of the screen. Pressing it again cycles to the next size in the list below,
# wrapping back to the first after the last. The step is inferred from the
# window's actual geometry, not counted key-presses, so switching windows or
# desktops in between doesn't leave the cycle in a stale state.
#
# FORMAT:  <direction> | <fractions, comma-separated, cycle order>
#
#   <direction>   left | right | top | bottom
#   <fractions>   how much of the screen the window takes on that press.
#                 Write as a/b (e.g. 1/3) or a decimal (e.g. 0.5). Any length
#                 list works -- two entries for a plain half/half toggle, four
#                 for a finer cycle.
#
# left/right and top/bottom are independent rows -- edit one without the
# other, or keep them identical by leaving both lists the same.

left   | 1/2, 1/3, 2/3
right  | 1/2, 1/3, 2/3
top    | 1/2, 1/3, 2/3
bottom | 1/2, 1/3, 2/3
