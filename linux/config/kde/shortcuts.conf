# OS Zimmee -- KDE global shortcut overrides.
#
# Format:  <group>|<key>|<value>
#   <group>  one or more KConfig groups, separated by '/' for nested groups
#   <value>  KDE stores shortcuts as: active,default,description
#            'none' as the active field disables the binding.
#            Use the literal token \t to separate multiple active shortcuts.
#
# Two jobs here:
#   1. Put the launcher on Super+Space, so the CapsLock tap in keyd has a target.
#   2. Free up the Super+Ctrl combinations KDE claims, since Super+Ctrl is the
#      Hyper prefix. Audited against a stock Kubuntu 26.04 / Plasma 6.6 install.

# --- launcher ---------------------------------------------------------------
# Super+Space added alongside the stock Alt+Space and Alt+F2.
services/org.kde.krunner.desktop|_launch|Meta+Space\tAlt+Space\tAlt+F2,Alt+Space\tAlt+F2,KRunner

# --- Meta+L ------------------------------------------------------------------
# Lock has no dedicated chord in the scheme -- it is a launcher action. Meta+L is
# unbound (by the keymap's `Meta+L | none` row) so that no lock chord sits one
# key from Meta+K. Lock Session keeps Ctrl+Alt+L, the conventional Linux
# fallback; the dedicated Screensaver key works either way.
#
# This supersedes an earlier arrangement that moved Lock Session off Meta+L so
# Krohnkite could claim it for focus-right. Krohnkite no longer uses bare Super
# at all -- the whole WM layer moved onto Hyper -- so that reason is gone.
ksmserver|Lock Session|Ctrl+Alt+L\tScreensaver,Meta+L\tScreensaver,Lock Session

# --- Hyper collisions: wacomtablet -----------------------------------------
# This module claims six letters and two digits on Super+Ctrl. It is for tablet
# hardware that is not present on this machine, so all of it is dead weight that
# would otherwise shadow Hyper+F/M/N/P/S/T/1/2 before any app saw them.
wacomtablet|Map to fullscreen|none,Meta+Ctrl+F,Map to fullscreen
wacomtablet|Map to screen 1|none,Meta+Ctrl+1,Map to screen 1
wacomtablet|Map to screen 2|none,Meta+Ctrl+2,Map to screen 2
wacomtablet|Next Profile|none,Meta+Ctrl+N,Next profile
wacomtablet|Previous Profile|none,Meta+Ctrl+P,Previous Profile
wacomtablet|Toggle screen map selection|none,Meta+Ctrl+M,Toggle between all screens
wacomtablet|Toggle stylus mode|none,Meta+Ctrl+S,Toggle the Stylus Tool Relative/Absolute
wacomtablet|Toggle touch tool|none,Meta+Ctrl+T,Enable/Disable the Touch Tool

# --- Hyper collisions: kwin / plasmashell -----------------------------------
# Both are obscure enough to be worth trading for a clean Hyper+A / Hyper+X.
kwin|Activate Window Demanding Attention|none,Meta+Ctrl+A,Activate Window Demanding Attention
plasmashell|clipboard_action|none,Meta+Ctrl+X,Automatic Action Popup Menu

# --- deliberately NOT disabled ----------------------------------------------
# Meta+Ctrl+Esc  -> Kill Window. Sits inside the hyper layer but is left alone:
# it is a useful native escape hatch, and it is NOT part of the taught scheme
# (it would be a dead key on macOS and Windows). See shared/shortcuts/README.md.
#
# Meta+Ctrl+Arrows and Meta+Ctrl+Shift+Arrows ARE claimed now -- the shortcuts
# module rebinds them from KDE's grid-directional desktop actions to the
# circular ones, so the chord and its meaning are unchanged and it now wraps.

# --- everything else lives in the keymap ------------------------------------
# The chord-by-chord scheme is NOT here. It lives in:
#   shared/shortcuts/keymap.conf    chord -> action id   (cross-OS)
#   linux/config/kde/actions.conf   action id -> KDE action
#   linux/config/kde/apps.conf      action id -> app
# and is applied by modules/shortcuts.sh. This file holds only the KDE-specific
# collision clearing that the keymap has no way to express.
#
# Krohnkite registers its bindings at install time, so they never appear in a
# pre-install audit. The shortcuts module overwrites the ones it uses -- their
# stock bare-Super chords (Meta+H/J/K/L, Meta+Shift+H/J/K/L, ...) are replaced
# outright, which is what frees bare Super to stay native.
