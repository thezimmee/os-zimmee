# OS Zimmee -- app toggle shortcuts.
#
# STATUS: data captured, mechanism NOT YET BUILT. See the shortcut-plan work.
#
# Format: <shortcut> | <window class> | <launch command> | <label>
#
# <window class> matches KWin's resourceClass, case-insensitively. These were
# read off live windows via KWin's scripting API rather than guessed -- three of
# the four are reverse-DNS and none are predictable from the binary name:
#
#   qdbus6 org.kde.KWin /Scripting org.kde.kwin.Scripting.loadScript <probe.js> p
#   qdbus6 org.kde.KWin /Scripting/Script<id> org.kde.kwin.Script.run
#   journalctl --user -u plasma-kwin_wayland | grep OSZWIN
#
# Intended semantics (true toggle):
#   window exists + focused      -> minimize
#   window exists + not focused  -> activate
#   not running                  -> launch
#
# Hyper = Super+Ctrl (see config/keyd/default.conf). Do NOT use Hyper+H/J/K/L:
# Krohnkite owns those for tile resize, deliberately.

Meta+Ctrl+B | brave-browser        | brave-browser  | Brave
Meta+Ctrl+C | code                 | code           | VS Code
Meta+Ctrl+A | com.anthropic.Claude | claude-desktop | Claude
Meta+Ctrl+T | dev.warp.Warp        | warp-terminal  | Warp

# Captured but unassigned:
#   org.kde.konsole | konsole | Konsole
