# OS Zimmee -- app toggle implementations.
#
# The CHORD for each of these lives in shared/shortcuts/keymap.conf; this file
# says what each app id actually is on Linux. Adding an app means a line here
# plus a line there -- no code.
#
# FORMAT:  <action> | <window class> | <desktop id> | <label>
#
#   <window class>  matches KWin's resourceClass, case-insensitively. These were
#                   read off live windows via KWin's scripting API rather than
#                   guessed -- three of the four are reverse-DNS and none are
#                   predictable from the binary name.
#
#   <desktop id>    the XDG desktop entry, NOT a command. The module reads the
#                   Exec line out of it at install time and resolves it to an
#                   absolute path for the systemd unit. This is deliberate:
#                   VS Code's real Exec is /usr/share/code/code, which guessing
#                   from the binary name would never have found. It is also the
#                   portable choice -- a desktop id means the same thing on any
#                   Linux, a hardcoded path does not.
#
# Semantics (true toggle):
#   window exists + focused      -> minimize
#   window exists + not focused  -> activate
#   not running                  -> launch, via a generated systemd user unit

app.brave    | brave-browser        | brave-browser.desktop        | Brave
app.terminal | dev.warp.Warp        | dev.warp.Warp.desktop        | Terminal
app.vscode   | code                 | code.desktop                 | VS Code
app.claude   | com.anthropic.Claude | com.anthropic.Claude.desktop | Claude

# Captured but unassigned:
#   org.kde.konsole | org.kde.konsole.desktop | Konsole
