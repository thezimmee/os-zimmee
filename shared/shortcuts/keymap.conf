# OS Zimmee -- the cross-OS keymap. SINGLE SOURCE OF TRUTH.
#
# Every OS track reads this file and binds the same chord to the same action id.
# Nothing here is Linux-, macOS-, or Windows-specific: this file says WHAT the
# chord means, each OS track says HOW that meaning is implemented.
#
#   shared/shortcuts/keymap.conf   chord -> action id      (this file, cross-OS)
#   linux/config/kde/*.conf        action id -> KDE action / app window class
#   macos/aerospace/*              action id -> aerospace command
#   windows/autohotkey/*           action id -> AHK routine
#
# FORMAT:  <chord> | <action> | <tier> | <description>
#
#   <chord>  'Hyper' is the portable token for the hyper prefix. Each OS track
#            expands it: Meta+Ctrl on Linux and Windows, Cmd+Ctrl on macOS --
#            the same physical chord and the same keycode. Modifier order is
#            always Hyper, then Shift, then Alt. Key names are KDE/Qt spellings;
#            the macOS and Windows tracks translate them.
#            'Super+...' (bare, no Hyper) marks a Class 2 "Super mirror" chord --
#            a short enumerated list where macOS already owns the chord and the
#            same physical motion is free elsewhere. See README S12.
#   <tier>   1 = core. Must be identical on all three OSes; a platform that
#                cannot honour it is a bug to fix, not a divergence to document.
#            2 = extended. Degrades gracefully; a platform may leave it unbound
#                rather than bind something that means a different thing.
#
# KEY NAMES: letters and digits are written as themselves. Everything else uses
# its Qt/KDE name, so no key in this file is ambiguous. Each OS track translates:
#
#   this file    Qt code   US-layout key                AeroSpace   AutoHotkey
#   ----------   -------   --------------------------   ---------   ----------
#   Comma        0x2C      ,                            comma       ,
#   Period       0x2E      .                            period      .
#   Apostrophe   0x27      ' (unshifted, right of ;)    quote       '
#   Semicolon    0x3B      ;                            semicolon   ;
#   Backslash    0x5C      \                            backslash   \
#   Left Right   ...       arrow keys                   left right  {Left} ...
#   Return       ...       Enter                        enter       {Enter}
#   Space        0x20      space bar                    space       {Space}
#
# SHIFT FOLDS INTO THE SYMBOL. Hyper+Shift+' does not reach KWin as
# Meta+Ctrl+Shift+Apostrophe -- pressing it emits Meta+Ctrl+" with no Shift
# modifier at all. KWin's own defaults show the convention (Meta+| , Meta+~ ,
# Meta++). A naively stored binding writes and reads back perfectly and simply
# never fires. The Linux backend folds it; see linux/CLAUDE.md.

# THREE RULES ARE THE WHOLE SCHEME:
#
#   1. Window navigation uses TWO models, one per axis, because Krohnkite's
#      directional focus is only good on one of them:
#
#              I     focus up        directional -- precise, walks the current
#              K     focus down      column, stops cleanly at the ends
#
#              J     focus PREVIOUS  circular -- walks the whole list in visual
#              L     focus NEXT      order and WRAPS
#
#      Measured, not assumed. Directional up/down walks a column correctly
#      (top -> mid -> bottom and back). Directional LEFT/RIGHT did not: from the
#      master it jumped to the BOTTOM of the stack rather than the nearest
#      window, so it was replaced by circular next/previous -- which covers
#      master<->stack properly and is the model Krohnkite inherits from dwm.
#
#      The two are complementary, not redundant: circular crosses between master
#      and stack, directional moves precisely inside a column.
#
#      Maximize is on M, centre on C.
#
#   2. Three scopes, smallest to largest:
#          I J K L   windows, within the current workspace
#          D         next display    (circular; Shift+D carries the window)
#          arrows    workspaces
#
#   3. Shift = "carry the window with me", everywhere it appears next to a
#      direction. It works identically in all three families.
#
# See README.md in this directory for the rationale behind every line.
#
#
# ===========================================================================
#  REVERT TO VIM hjkl
# ===========================================================================
# The current cross (I up, J left, K down, L right) is not vim-adjacent: K is
# DOWN here and UP in vim/Vimium, and J is LEFT here and DOWN in vim. If that
# inversion is what ends up grating, hjkl is the fallback -- it is the mapping
# every other tool in the stack already uses.
#
# Paste these twelve rows over the wm.focus / wm.move / wm.resize rows below,
# then run `bash linux/install shortcuts`. Nothing else has to change.
#
#   Hyper+H                 | wm.focus.left       | 1 | Focus window left
#   Hyper+J                 | wm.focus.down       | 1 | Focus window down
#   Hyper+K                 | wm.focus.up         | 1 | Focus window up
#   Hyper+L                 | wm.focus.right      | 1 | Focus window right
#   Hyper+Shift+H           | wm.move.left        | 1 | Move window left
#   Hyper+Shift+J           | wm.move.down        | 1 | Move window down
#   Hyper+Shift+K           | wm.move.up          | 1 | Move window up
#   Hyper+Shift+L           | wm.move.right       | 1 | Move window right
#   Hyper+Alt+H             | wm.resize.shrinkwidth  | 2 | Shrink width
#   Hyper+Alt+J             | wm.resize.growheight   | 2 | Grow height
#   Hyper+Alt+K             | wm.resize.shrinkheight | 2 | Shrink height
#   Hyper+Alt+L             | wm.resize.growwidth    | 2 | Grow width
#
# Note the Alt rows go back to i3's convention, where DOWN grows height and UP
# shrinks it. That is not spatial, but it is what every hjkl tiler does, so it
# belongs with hjkl.
#
# OPTIONAL, and worth doing: hjkl frees I, so move the terminal back to it and
# restore the U I O P app row --
#
#   Hyper+I                 | app.terminal        | 1 | Terminal (Warp)
#
# replacing the Hyper+Semicolon row. Maximize stays on M and displays stay on
# Hyper+D / Hyper+Shift+D either way; neither collides with hjkl.
# ===========================================================================


# --- disabled native chords -------------------------------------------------
# Action 'none' means: actively UNBIND this on every OS that ships it, so the
# chord is dead rather than doing something on one machine and nothing on the
# others.
#
# Meta+L: lock has no dedicated chord in this scheme -- it is a launcher action.
# Each OS keeps a native fallback anyway (Ctrl+Alt+L on Linux, physical
# Ctrl+Cmd+Q on macOS). Windows CANNOT unbind Win+L; see README S9.
Meta+L                  | none                | 1 | Native lock chord -- unbound where possible
#
# Two Spectacle bindings sit INSIDE the hyper layer. They are invisible to a
# file-based audit (registered from a .desktop, never written to
# kglobalshortcutsrc) and were found only by a live D-Bus sweep. Linux only.
Meta+Ctrl+R             | none                | 1 | Spectacle Record Window -- inside the hyper layer
Meta+Ctrl+Print         | none                | 1 | Spectacle Capture Window Under Cursor -- inside the hyper layer


# ============================================================================
#  TIER 1 -- core. Identical on all three OSes.
# ============================================================================

# --- the gesture ------------------------------------------------------------
Tap                     | sys.launcher        | 1 | Launcher (tap CapsLock alone)

# --- apps -- Hyper + U I O P ------------------------------------------------
# True toggle: focused -> minimize, running -> activate, not running -> launch.
#
# THIS IS THE BLOCK TO EDIT to move an app. The Linux implementation is
# data-driven from this file, so it is a config edit and a re-run, never code.
#
# RESERVED, never assign to an app:
#   I J K L (navigation) . U O P Semicolon (apps) . Apostrophe (layout)
#   M (maximize) . D (display) . C (centre) . F (float) . W (close)
#   Comma Period (displays) . M (maximize) . F (float) . W (close)
#   R (Spectacle record, see above)
# FREE for more apps:  A B E G H N Q S T V X Y Z  and Comma, Period
# (Q freed when sys.quit moved off the Hyper layer onto bare Ctrl+Q -- see below.)
Hyper+U                 | app.brave           | 1 | Brave
Hyper+Semicolon         | app.terminal        | 1 | Terminal (Warp)
Hyper+O                 | app.vscode          | 1 | VS Code
Hyper+P                 | app.claude          | 1 | Claude

# --- windows -- the cross: Hyper + i/j/k/l ----------------------------------
# Directional keys address windows WITHIN the current workspace.
Hyper+K                 | wm.focus.down       | 1 | Focus window down
Hyper+I                 | wm.focus.up         | 1 | Focus window up

# Circular next/previous through the window list, wrapping at the ends. Ignores
# geometry, so it works identically in every layout -- including the overlapping
# ones (Floating, Monocle, Spread, Stair, Cascade) where left/right is
# meaningless and directional focus quietly degrades to list order.
Hyper+L                 | wm.focus.next       | 1 | Focus next window (circular)
Hyper+J                 | wm.focus.prev       | 1 | Focus previous window (circular)

# Hyper+Shift+<direction> is claimed by wm.snap (tier 2, see below) -- pressing
# it repeatedly snaps the window to that edge, cycling sizes. The ordinal
# move (Krohnkite's ShiftLeft/Down/Up/Right -- KDE labels them "Move Up/Prev"
# and "Move Down/Next") drops one layer deeper, onto Hyper+Shift+Alt+<direction>:
# Alt is already the "adjust" layer (resize sits on Hyper+Alt+<direction>), and
# Shift on top of it is still "carry the window with me" (rule 3) -- consistent,
# not a new idiom.
#
# Two different meanings share this one chord, one per window state: on a
# TILED window it's tile-order move (swaps position in the master/stack). On a
# FLOATING window it's an incremental step that snaps to the screen edge
# rather than sliding past it -- Linux implements the edge-snap itself
# (Krohnkite's own step has no clamping); see linux/config/kde/actions.conf.
Hyper+Shift+Alt+J       | wm.move.left        | 1 | Move window left (tile order / edge-snapping step when floating)
Hyper+Shift+Alt+K       | wm.move.down        | 1 | Move window down (tile order / edge-snapping step when floating)
Hyper+Shift+Alt+I       | wm.move.up          | 1 | Move window up (tile order / edge-snapping step when floating)
Hyper+Shift+Alt+L       | wm.move.right       | 1 | Move window right (tile order / edge-snapping step when floating)

# --- displays -- Hyper + , / .  (rule 2) ------------------------------------
# Circular. With two monitors 'previous' and 'next' are the same hop, so either
# key does the job; the pair costs nothing and pays off on a three-display desk.
Hyper+D                 | mon.focus.next      | 1 | Focus next display
Hyper+Shift+D           | mon.movewin.next    | 1 | Move window to next display

# --- workspaces -- Hyper + arrows  (rule 2) ---------------------------------
# The arrows are the natural home once ',' and '.' belong to displays -- and
# they are nearly free: KDE binds Meta+Ctrl+arrows and Meta+Ctrl+Shift+arrows
# natively to desktop movement, and Windows binds Win+Ctrl+Left/Right to switch
# virtual desktop. We bind the CIRCULAR actions over KDE's grid-directional
# defaults on the same chords, so the chord is unchanged and only wraps now.
Hyper+Left              | ws.prev             | 1 | Previous workspace
Hyper+Right             | ws.next             | 1 | Next workspace
Hyper+Shift+Left        | ws.movewin.prev     | 1 | Move window to previous workspace
Hyper+Shift+Right       | ws.movewin.next     | 1 | Move window to next workspace

# --- layout -- Hyper + ; ----------------------------------------------------
# Apostrophe is a pinky reach from home position, one key past Semicolon. Shift
# reverses, which is the universal cycle idiom. (Semicolon is free if this ever
# wants to move one key closer -- it is the pinky's home key.)
Hyper+Apostrophe        | wm.layout.next      | 1 | Next layout
Hyper+Shift+Apostrophe  | wm.layout.prev      | 1 | Previous layout

# --- window shape -----------------------------------------------------------
# Monocle-style, not native OS maximize -- on Linux this MUST route through
# Krohnkite's own layout engine (KrohnkiteMonocleLayout), never native "Window
# Maximize": the native call breaks Krohnkite's own focus/move keys for as long
# as the window stays maximized (see linux/config/kde/actions.conf). The
# native escape hatch lives on Hyper+Shift+O instead, tier 2, below.
Hyper+M                 | wm.maximize         | 1 | Maximize (monocle)
Hyper+F                 | wm.float            | 1 | Toggle floating

# --- close and quit ---------------------------------------------------------
# On macOS this is a Karabiner carve-out emitting plain Cmd+W, so the action is
# identical rather than merely similar. See README S4.
Hyper+W                 | sys.close           | 1 | Close window

# sys.quit moved OFF the Hyper layer onto the bare native chord, one OS at a
# time: Ctrl+Q is the everyday quit convention on Linux and Windows (Firefox,
# many GTK/Qt apps), so it is a KDE GLOBAL shortcut here, not merely something
# left for each app to interpret -- it fires OszQuitApp (close every window of
# the active app) regardless of whether the focused app has its own Ctrl+Q
# binding. That is a deliberate, accepted trade against the Class 3 guidance in
# README S12: a global chord is intercepted by the compositor before the
# focused app ever sees the keypress, which silently breaks any app-local use
# of Ctrl+Q that isn't "quit" -- concretely, Ctrl+S/Ctrl+Q terminal XON/XOFF
# flow control in Warp. If that bites, the fix is a Warp-local override, not a
# change here. macOS is NOT covered by this row: it already has a genuinely
# native Cmd+Q per app, and the Hyper+Q carve-out this table used to specify
# was never actually implemented in karabiner.json -- revisit macOS's story
# for this action separately when that track is migrated.
Ctrl+Q                  | sys.quit            | 1 | Quit application (Linux/Windows; global, not app-local)

# --- Class 2 mirror -- screenshots ------------------------------------------
# Bare Super, not Hyper: Super sits immediately left of the space bar on a PC
# exactly as Cmd does on a Mac, so these are the same thumb and the same motion.
#
# DIVERGENCE, accepted deliberately: macOS binds Cmd+Shift+4 to region-screenshot,
# not to recording. Under this mapping the same motion screenshots on the Mac and
# starts a recording on Linux/Windows unless macOS's default is displaced via
# com.apple.symbolichotkeys. Chosen with that cost understood -- see README S12.1.
Super+Shift+5           | sys.screenshot      | 1 | Screenshot
Super+Shift+4           | sys.record          | 1 | Screen recording


# ============================================================================
#  TIER 2 -- extended. May degrade rather than mean something different.
# ============================================================================

# --- resize -- Hyper + Alt + the cross (i/j/k/l) ----------------------------
# Direction means "grow that way": right/up grow, left/down shrink. This drops
# i3's convention (where DOWN grows height and UP shrinks it), which never had a
# spatial justification. Hyper+Alt is the
# "adjust" layer: it changes the shape of what the tier 1 keys select.
Hyper+Alt+J             | wm.resize.shrinkwidth  | 2 | Shrink width
Hyper+Alt+I             | wm.resize.growheight   | 2 | Grow height
Hyper+Alt+K             | wm.resize.shrinkheight | 2 | Shrink height
Hyper+Alt+L             | wm.resize.growwidth    | 2 | Grow width

# --- window shape, less used ------------------------------------------------
Hyper+Shift+F           | wm.fullscreen       | 2 | Fullscreen toggle

# Native, literal edge-to-edge maximize -- no Krohnkite gaps/borders, no
# layout involved. The deliberate escape hatch for when that's actually
# wanted. Linux only: it's specifically the trade against Hyper+M's
# Krohnkite-safe monocle (see linux/config/kde/actions.conf); the other OSes
# have no equivalent conflict to escape from, so nothing to bind here yet.
Hyper+Shift+O           | wm.maximize.native  | 2 | Maximize (native, literal edge-to-edge)

# --- snap-cycle -- Hyper+Shift+i/j/k/l ---------------------------------------
# Repeated presses cycle the sizes configured on Linux in
# linux/config/kde/snapcycle.conf (default 1/2 -> 1/3 -> 2/3). Sits directly on
# the tier 1 Shift-move chord shape (i/j/k/l, not arrows) because this is the
# more-reached-for of the two "move" meanings; the tile-order move it displaced
# drops one layer deeper onto Hyper+Shift+Alt (see the tier 1 windows section
# above). Linux only for now: no AeroSpace or AHK implementation exists yet, so
# these degrade to unbound on macOS/Windows rather than doing something
# narrower.
Hyper+Shift+J           | wm.snap.left        | 2 | Snap window left (cycle sizes)
Hyper+Shift+L           | wm.snap.right       | 2 | Snap window right (cycle sizes)
Hyper+Shift+I           | wm.snap.top         | 2 | Snap window top (cycle sizes)
Hyper+Shift+K           | wm.snap.bottom      | 2 | Snap window bottom (cycle sizes)
# Centre a floating window on its screen. Tier 2: Linux and Windows can do it
# (KWin has a native action; AHK has WinMove), AeroSpace has no equivalent, so
# macOS leaves it unbound rather than binding something that means less.
Hyper+C                 | wm.center           | 2 | Centre floating window
Hyper+Return            | wm.master           | 2 | Promote to master

# --- workspaces, absolute ---------------------------------------------------
# Demoted from tier 1: circular ',' and '.' cover day-to-day switching, and
# these nine chords are worth having without being worth learning first.
Hyper+1                 | ws.go.1             | 2 | Workspace 1
Hyper+2                 | ws.go.2             | 2 | Workspace 2
Hyper+3                 | ws.go.3             | 2 | Workspace 3
Hyper+4                 | ws.go.4             | 2 | Workspace 4
Hyper+5                 | ws.go.5             | 2 | Workspace 5
Hyper+6                 | ws.go.6             | 2 | Workspace 6
Hyper+7                 | ws.go.7             | 2 | Workspace 7
Hyper+8                 | ws.go.8             | 2 | Workspace 8
Hyper+9                 | ws.go.9             | 2 | Workspace 9

Hyper+Shift+1           | ws.movewin.1        | 2 | Move window to workspace 1
Hyper+Shift+2           | ws.movewin.2        | 2 | Move window to workspace 2
Hyper+Shift+3           | ws.movewin.3        | 2 | Move window to workspace 3
Hyper+Shift+4           | ws.movewin.4        | 2 | Move window to workspace 4
Hyper+Shift+5           | ws.movewin.5        | 2 | Move window to workspace 5
Hyper+Shift+6           | ws.movewin.6        | 2 | Move window to workspace 6
Hyper+Shift+7           | ws.movewin.7        | 2 | Move window to workspace 7
Hyper+Shift+8           | ws.movewin.8        | 2 | Move window to workspace 8
Hyper+Shift+9           | ws.movewin.9        | 2 | Move window to workspace 9

# --- system -----------------------------------------------------------------
# Alt+Space keeps the shape of the Ctrl+Alt+Space this replaces, while the Hyper
# prefix keeps it inside the one-prefix rule. The extra Alt also separates it
# from the bare CapsLock TAP that opens the launcher, so a slip cannot fire the
# wrong one. macOS's native Ctrl+Cmd+Space keeps working on real modifiers.
Hyper+Alt+Space                 | sys.emoji           | 2 | Emoji picker
